<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cristio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    text-align: center;
  }
  h1 {
    font-size: 4rem;
    font-weight: 300;
    letter-spacing: 0.5rem;
    margin-bottom: 1rem;
    color: #ffffff;
  }
  p {
    font-size: 1.1rem;
    line-height: 1.8;
    max-width: 480px;
    color: #888;
    margin-bottom: 2rem;
  }
  .divider {
    width: 2rem;
    height: 1px;
    background: #333;
    margin: 1.5rem auto;
  }
  .sub {
    font-size: 0.85rem;
    color: #555;
    letter-spacing: 0.15rem;
    text-transform: uppercase;
  }
  #chat-btn {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    width: 3.25rem;
    height: 3.25rem;
    border-radius: 50%;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #e0e0e0;
    font-size: 1.5rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  #chat-btn:hover { background: #2a2a2a; }
  #chat-box {
    position: fixed;
    bottom: 5.5rem;
    right: 1.5rem;
    width: 340px;
    height: 460px;
    background: #141414;
    border: 1px solid #222;
    border-radius: 12px;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  #chat-box.open { display: flex; }
  #chat-header {
    padding: 1rem;
    border-bottom: 1px solid #222;
    color: #aaa;
    font-size: 0.85rem;
    letter-spacing: 0.1rem;
    text-transform: uppercase;
  }
  #chat-msgs {
    flex: 1;
    padding: 1rem;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .msg {
    max-width: 85%;
    padding: 0.6rem 0.9rem;
    border-radius: 8px;
    font-size: 0.9rem;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    text-align: left;
  }
  .msg.user {
    background: #1e1e1e;
    color: #ccc;
    align-self: flex-end;
  }
  .msg.bot {
    background: #1a1a1a;
    color: #aaa;
    align-self: flex-start;
  }
  .msg.typing {
    color: #555;
    font-style: italic;
    background: none;
    padding-left: 0;
  }
  #chat-input-wrap {
    display: flex;
    border-top: 1px solid #222;
    padding: 0.5rem;
    gap: 0.5rem;
  }
  #chat-input {
    flex: 1;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 0.5rem 0.75rem;
    color: #e0e0e0;
    font-size: 0.9rem;
    outline: none;
  }
  #chat-input::placeholder { color: #555; }
  #chat-send {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 6px;
    color: #e0e0e0;
    padding: 0.5rem 1rem;
    cursor: pointer;
    font-size: 0.9rem;
    transition: background 0.2s;
  }
  #chat-send:hover { background: #2a2a2a; }
  @media (max-width: 480px) {
    h1 { font-size: 2.5rem; letter-spacing: 0.3rem; }
    #chat-box { width: calc(100vw - 2rem); right: 1rem; bottom: 5rem; }
    #chat-btn { right: 1rem; bottom: 1rem; }
  }
</style>
</head>
<body>
  <h1>Cristio</h1>
  <div class="divider"></div>
  <p>Be still.&ensp;Watch.&ensp;The land is waking.</p>
  <span class="sub">—&ensp;Reino Unido&ensp;—</span>

  <div id="chat-box">
    <div id="chat-header">Cristio</div>
    <div id="chat-msgs"></div>
    <div id="chat-input-wrap">
      <input id="chat-input" type="text" placeholder="Type something..." autocomplete="off">
      <button id="chat-send">Send</button>
    </div>
  </div>
  <button id="chat-btn">+</button>

<script>
const btn = document.getElementById('chat-btn');
const box = document.getElementById('chat-box');
const msgs = document.getElementById('chat-msgs');
const input = document.getElementById('chat-input');
const send = document.getElementById('chat-send');

btn.addEventListener('click', () => {
  const open = box.classList.toggle('open');
  btn.textContent = open ? '×' : '+';
  if (open) input.focus();
});

async function ask() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMsg(text, 'user');
  const typing = addMsg('...', 'typing');

  try {
    const res = await fetch('https://api.cristio.ru/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    typing.remove();
    if (data.response) addMsg(data.response, 'bot');
    else addMsg('...', 'bot');
  } catch {
    typing.remove();
    addMsg('The land is quiet. Try again later.', 'bot');
  }
}

function addMsg(text, cls) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
  return el;
}

send.addEventListener('click', ask);
input.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
</script>
</body>
</html>
