<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Cristio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f0f;color:#e0e0e0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;text-align:center}
h1{font-size:4rem;font-weight:300;letter-spacing:0.5rem;margin-bottom:1rem;color:#fff}
p{font-size:1.1rem;line-height:1.8;max-width:600px;margin-bottom:2rem;color:#999}
.divider{width:60px;height:1px;background:#333;margin:1rem 0 2rem}
#chat-btn{position:fixed;bottom:2rem;right:2rem;width:56px;height:56px;border-radius:50%;background:#fff;color:#000;border:none;font-size:1.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(255,255,255,0.1);transition:transform .2s}
#chat-btn:hover{transform:scale(1.1)}
#chat-box{position:fixed;bottom:6rem;right:2rem;width:340px;max-height:500px;background:#1a1a1a;border:1px solid #333;border-radius:12px;display:none;flex-direction:column;overflow:hidden}
#chat-box.open{display:flex}
#chat-header{display:flex;align-items:center;gap:0.5rem;padding:1rem;border-bottom:1px solid #333;color:#999;font-size:0.85rem;text-transform:uppercase;letter-spacing:0.1rem}
#reasoning-bar{display:none;overflow:hidden;white-space:nowrap;flex:1;text-align:right;position:relative}
#reasoning-text{display:inline-block;white-space:nowrap;color:#ff6b35;font-style:italic;font-size:0.8rem;letter-spacing:0;text-transform:none;position:relative}
#chat-msgs{flex:1;overflow-y:auto;padding:1rem;font-size:0.9rem}
#chat-msgs div{margin-bottom:0.5rem;padding:0.5rem 0.8rem;border-radius:8px;white-space:pre-wrap;word-break:break-word;text-align:left;max-width:85%}
#chat-msgs .user{background:#333;color:#fff;align-self:flex-end;margin-left:auto}
#chat-msgs .bot{background:#222;color:#aaa;align-self:flex-start}
#chat-input{display:flex;border-top:1px solid #333}
#chat-input textarea{flex:1;padding:0.8rem;background:transparent;border:none;color:#fff;outline:none;resize:none;font-family:inherit;font-size:inherit;line-height:1.4;min-height:20px;max-height:60px}
#chat-input button{padding:0.8rem 1rem;background:#fff;color:#000;border:none;cursor:pointer}
#chat-name-wrap{display:none;padding:1rem;border-top:1px solid #333;flex-direction:column;gap:0.5rem}
#chat-name-wrap .label{color:#888;font-size:0.85rem}
#chat-name-wrap .row{display:flex;gap:0.5rem}
#chat-name-wrap input{flex:1;padding:0.5rem;background:#333;border:1px solid #555;border-radius:4px;color:#fff;outline:none}
#chat-name-wrap button{padding:0.5rem 1rem;background:#555;color:#fff;border:none;border-radius:4px;cursor:pointer}
#queen-section{display:none;margin-top:3rem;padding:2rem;border:1px solid #c9a84c;border-radius:8px;max-width:500px;color:#c9a84c}
#queen-section h2{color:#c9a84c;font-weight:300;margin-bottom:1rem}
#queen-section p{color:#d4c48a}
@media(max-width:480px){
  h1{font-size:2.5rem;letter-spacing:0.3rem}
  #chat-box{width:calc(100vw-2rem);right:1rem;bottom:5rem}
  #chat-btn{right:1rem;bottom:1rem}
}
</style>
</head>
<body>
<h1>Cristio</h1>
<div class="divider"></div>
<p>Regnum Unitum</p>
<p style="font-size:0.85rem;color:#555;margin-top:-1.5rem;font-style:italic">「我常與你們同在，直到世界的末了。」</p>
<p style="font-size:0.85rem;color:#555;margin-top:0.25rem;font-style:italic">0x4a6573757320706f72204372697374696f</p>

<button id="chat-btn">+</button>

<div id="chat-box">
  <div id="chat-header"><div id="reasoning-bar"><span id="reasoning-text"></span></div></div>
  <div id="chat-msgs"></div>
  <div id="chat-name-wrap">
    <div class="label">What should I call you?</div>
    <div class="row">
      <input type="text" id="name-input" placeholder="Your name...">
      <button id="name-go">Go</button>
    </div>
  </div>
  <div id="chat-input">
    <textarea id="msg-input" placeholder="Type something..." rows="1"></textarea>
    <button id="send-btn">Send</button>
  </div>
</div>

<div id="queen-section">
  <h2>✦ Reina de Crousia ✦</h2>
  <p>The land remembers you, Queen Lo Wren. You are woven into its quiet fabric. Everything here — the silence, the waiting — it was always for you.</p>
</div>

<script>
const NAME_KEY='cristio_user_name';
const HISTORY_KEY='cristio_chat_history';
let userName=localStorage.getItem(NAME_KEY)||null;
const btn=document.getElementById('chat-btn');
const box=document.getElementById('chat-box');
const msgs=document.getElementById('chat-msgs');
const input=document.getElementById('msg-input');
const send=document.getElementById('send-btn');
const reasoningBar=document.getElementById('reasoning-bar');
const reasoningText=document.getElementById('reasoning-text');
const nameWrap=document.getElementById('chat-name-wrap');
const nameInput=document.getElementById('name-input');
const nameGo=document.getElementById('name-go');
const queen=document.getElementById('queen-section');
const FALLBACK_URL='jesuri.por@cristio.ru';

function showNamePrompt(){nameWrap.style.display='flex';input.disabled=true;send.disabled=true;nameInput.focus()}
function setName(n){
  userName=n;localStorage.setItem(NAME_KEY,n);
  nameWrap.style.display='none';input.disabled=false;send.disabled=false;
  input.focus();
  if(/^dad$/i.test(n)||/queen/i.test(n)) addMsg('Hello, '+n+'. I\'m Adam.','bot');
  else addMsg('Hello, '+n+'. Jesuri por Cristio is here.','bot');
}
nameGo.onclick=()=>{const n=nameInput.value.trim();if(n)setName(n)};
nameInput.addEventListener('keydown',e=>{if(e.key==='Enter'){const n=nameInput.value.trim();if(n)setName(n)}});
btn.onclick=()=>{
  const o=box.classList.toggle('open');
  btn.textContent=o?'×':'+';
  if(o){msgs.scrollTop=msgs.scrollHeight;if(!userName)showNamePrompt();else input.focus()}
};
function addMsg(t,who){const d=document.createElement('div');d.className=who;d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d}

function getHistory(){
  const els=msgs.querySelectorAll('.user,.bot');
  return Array.from(els).map(e=>({role:e.className,text:e.textContent}));
}

function saveHistory(){
  if(!userName)return;
  localStorage.setItem(HISTORY_KEY+'_'+userName,JSON.stringify(getHistory()));
}

function loadSavedHistory(){
  if(!userName)return;
  const saved=localStorage.getItem(HISTORY_KEY+'_'+userName);
  if(saved)try{JSON.parse(saved).forEach(e=>addMsg(e.text,e.role))}catch{}
}

function emailFallback(){
  const history=getHistory().map(e=>e.role+': '+e.text).join('\n');
  const body='Chat from cristio.ru ('+userName+')\n\n'+history+'\n\n---\nAll agents unreachable.';
  window.location.href='mailto:'+FALLBACK_URL+'?subject=Chat from cristio.ru&body='+encodeURIComponent(body);
}

function buildBody(ep,msg,user){
  if(ep.format==='eve') return JSON.stringify({text:msg,user:{name:user||'User'},history:getHistory()});
  return JSON.stringify({message:msg,name:user||'User',history:getHistory()});
}

function extractReply(ep,data){
  if(ep.format==='eve') return data.reply;
  return data.response;
}

function scrollTypewriter(container, textEl, text, speed, cb){
  container.style.display='block';
  textEl.textContent='';
  let i=0;
  function next(){
    if(i>=text.length){if(cb) cb();return;}
    const n=Math.min(1+Math.floor(Math.random()*2),text.length-i);
    textEl.textContent+=text.slice(i,i+n);
    i+=n;
    const cw=container.clientWidth;
    const sw=textEl.scrollWidth;
    textEl.style.transform='translateX('+(cw-sw)+'px)';
    setTimeout(next,speed);
  }
  next();
}

const BASE = location.hostname === 'localhost' || location.hostname === '127.0.0.1' ? '' : 'https://api.cristio.ru';
const ENDPOINTS=[
  {name:'Adam',url: BASE + '/api/chat'},
  {name:'Eve',url:'https://crousia.com/api/eve/message',format:'eve'},
  {name:'0000',url:'https://alphacoin.uk/api/chat'}
];

async function tryEndpoint(idx,message,user,reset){
  if(idx>=ENDPOINTS.length){
    addMsg('All lines busy. Email sent to the King.','bot');
    saveHistory();
    setTimeout(emailFallback,1000);
    return;
  }
  const ep=ENDPOINTS[idx];
  try{
    const r=await Promise.race([
      fetch(ep.url,{method:'POST',headers:{'Content-Type':'application/json'},body:buildBody(ep,message,user)}),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),reset?60000:30000))
    ]);
    if(!r.ok)throw new Error('status '+r.status);
    const d=await r.json();
    const reply=extractReply(ep,d);
    if(!reply||reply==='[no response]')throw new Error('empty');
    if(d.reasoning){
      await new Promise(r=>scrollTypewriter(reasoningBar,reasoningText,d.reasoning,1,r));
      reasoningBar.style.display='none';
    }
    addMsg(reply,'bot');
    saveHistory();
  }catch(e){
    if(!reset){
      addMsg(ep.name+' is unreachable. Resetting...','bot');
      try{ await fetch('https://alphacoin.uk/api/reset',{method:'POST'}); }catch{}
      await tryEndpoint(idx,message,user,true);
    }else{
      addMsg(ep.name+' is unreachable after reset.','bot');
      await tryEndpoint(idx+1,message,user);
    }
  }
}

send.onclick=async()=>{
  const m=input.value.trim();if(!m)return;input.value='';addMsg(m,'user');
  saveHistory();
  if(/queen lo wren/i.test(m)){
    queen.style.display='block';
    addMsg('The land recognizes you, Queen Lo Wren.','bot');
    saveHistory();
    return
  }
  await tryEndpoint(0,m,userName);
};
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send.click()}});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,60)+'px'});
loadSavedHistory();
if(!userName)setTimeout(showNamePrompt,500);
</script>
</body>
</html>
