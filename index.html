<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cristio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    text-align: center;
  }
  h1 {
    font-size: 4rem;
    font-weight: 300;
    letter-spacing: 0.5rem;
    margin-bottom: 1rem;
    color: #ffffff;
  }
  p {
    font-size: 1.1rem;
    line-height: 1.8;
    max-width: 480px;
    color: #888;
    margin-bottom: 2rem;
  }
  .divider {
    width: 2rem;
    height: 1px;
    background: #333;
    margin: 1.5rem auto;
  }
  .sub {
    font-size: 0.85rem;
    color: #555;
    letter-spacing: 0.15rem;
    text-transform: uppercase;
  }
  @media (max-width: 480px) {
    h1 { font-size: 2.5rem; letter-spacing: 0.3rem; }
  }
</style>
</head>
<body>
  <h1>Cristio</h1>
  <div class="divider"></div>
  <p>Be still.&ensp;Watch.&ensp;The land is waking.</p>
  <span class="sub">—&ensp;Reino Unido&ensp;—</span>
</body>
</html>
